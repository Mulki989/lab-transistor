<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab Transistor</title>
<meta name="description" content="Game belajar transistor BJT, bias, dan penguat (Minggu 6-7).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: PCB board — a status header (player XP), then level "pads" wired along two boards (Minggu 6, Minggu 7) and a final chip. */
:root{
  --bg:#EDF3EF; --surface:#FFFFFF; --surface2:#F4F8F5; --ink:#14231D; --muted:#56695F; --line:#D2DED7;
  --pcb:#0F3D2E; --pcb-ink:#E9F3EE; --trace:#1E7A57; --trace-soft:#DDEEE5; --copper:#B0601C; --copper-soft:#F6E7D8;
  --gold:#C8901F; --bad:#B8362A; --bad-soft:#F8E1DE; --good:#1E7A57; --good-soft:#DDEEE5;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1A14; --surface:#10251D; --surface2:#142D24; --ink:#E4EFE9; --muted:#97B0A5; --line:#24443A;
  --pcb:#0D2F23; --pcb-ink:#E4EFE9; --trace:#46C08D; --trace-soft:#173A2E; --copper:#E38D47; --copper-soft:#3A2817;
  --gold:#EDC060; --bad:#EE7666; --bad-soft:#3D1D19; --good:#46C08D; --good-soft:#173A2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1A14; --surface:#10251D; --surface2:#142D24; --ink:#E4EFE9; --muted:#97B0A5; --line:#24443A;
  --pcb:#0D2F23; --pcb-ink:#E4EFE9; --trace:#46C08D; --trace-soft:#173A2E; --copper:#E38D47; --copper-soft:#3A2817;
  --gold:#EDC060; --bad:#EE7666; --bad-soft:#3D1D19; --good:#46C08D; --good-soft:#173A2E; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.examhud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;margin-bottom:12px}
.examhud .t{font-family:var(--f-mono);font-weight:600;padding:3px 10px;border-radius:8px;background:var(--copper-soft);color:var(--copper)}
.examhud .v{padding:3px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-weight:700}
.exam-on, .exam-on *{-webkit-user-select:none;user-select:none}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
sub{font-size:.72em}

/* header / player */
.hud{background:var(--pcb);color:var(--pcb-ink);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.hud::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:14px 14px;pointer-events:none}
.hud h1{font-size:clamp(24px,4vw,32px);font-weight:700}
.hud .sub{opacity:.8;font-size:14px}
.rank{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0;position:relative;z-index:1}
.rank .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.rank .name{font-family:var(--f-display);font-size:20px;font-weight:700;color:#F2B477}
.xpbar{width:min(260px,60vw);height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#E38D47,#F2C66A);width:0;transition:width .6s}
.xptext{font-size:13px;opacity:.85}
.hud .left{position:relative;z-index:1;min-width:0}
.sync{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.sync i{width:8px;height:8px;border-radius:50%;background:#F2C66A}
.sync.ok i{background:#5BD39F}.sync.local i{background:#F2C66A}

/* tabs */
.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{border:1px dashed var(--copper);background:var(--copper-soft);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:14px;margin-bottom:14px}

/* board */
.board{margin-bottom:26px}
.board-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.board-head h2{font-size:20px}
.board-head .meta{color:var(--muted);font-size:14px}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;position:relative}
.pad{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s}
.pad:hover:not([disabled]){transform:translateY(-2px);border-color:var(--trace)}
.pad .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.pad h3{font-size:16.5px;line-height:1.25}
.pad p{margin:0;font-size:13px;color:var(--muted)}
.pad .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.chip.open{background:var(--copper-soft);color:var(--copper)}
.chip.pass{background:var(--good-soft);color:var(--good)}
.chip.lock{background:var(--surface2);color:var(--muted)}
.pad[disabled]{cursor:not-allowed;border-style:dashed;background:var(--surface2)}
.pad[disabled] h3,.pad[disabled] p{opacity:.6}
.pad.boss{border-color:var(--copper);background:linear-gradient(160deg,var(--copper-soft),var(--surface) 60%)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px}
.star-on{fill:var(--gold)}.star-off{fill:var(--line)}
.pin{position:absolute;left:-6px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--trace);box-shadow:0 0 0 3px var(--bg)}
.pad[disabled] .pin{background:var(--line)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.back{background:none;border:none;color:var(--trace);font-weight:700;padding:4px 0;margin-bottom:10px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.lcard{background:var(--surface2);border-radius:var(--r);padding:14px 16px;min-width:0}
.lcard h4{margin:0 0 6px;font-family:var(--f-display);font-size:15px;color:var(--trace)}
.lcard p{margin:0;font-size:14.5px}
.formula{font-family:var(--f-mono);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;overflow-x:auto;white-space:nowrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-weight:700;font-size:15px;background:var(--copper);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.now{background:var(--copper)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}
.ctx{background:var(--surface2);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:14px;overflow-x:auto}
.ctx table{border-collapse:collapse}
.ctx td{padding:2px 14px 2px 0;white-space:nowrap}
.ctx td:first-child{color:var(--muted)}
.qtext{font-size:18px;font-weight:700;margin:4px 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;text-align:left;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--copper)}
.opt.sel-ok{border-color:var(--good);background:var(--good-soft)}
.opt.sel-no{border-color:var(--bad);background:var(--bad-soft)}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{font-family:var(--f-mono);font-size:18px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:180px;max-width:100%}
.unit{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.fb{margin-top:16px;border-radius:var(--r);padding:14px 16px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb h4{margin:0 0 6px;font-family:var(--f-display);font-size:17px}
.fb.ok h4{color:var(--good)}.fb.no h4{color:var(--bad)}
.steps{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:6px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:14.5px}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--copper);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.steps .mono{overflow-wrap:anywhere}

/* result */
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1}
.result .stars svg{width:40px;height:40px}
.newbadges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.badge{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
.badge .ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--copper-soft);color:var(--copper)}
.badge.off{opacity:.55}.badge.off .ico{background:var(--surface2);color:var(--muted)}
.badge h4{margin:0;font-family:var(--f-display);font-size:15px}
.badge p{margin:0;font-size:13px;color:var(--muted)}
.ico svg{width:24px;height:24px}

/* identity */
.ident{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;margin-top:6px}
.ident label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.ident input{padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

/* dosen */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .v{font-family:var(--f-display);font-size:30px;font-weight:700}
.tile .k{font-size:13px;color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.rekap{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
.rekap th,.rekap td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rekap th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2)}
.rekap td.c{text-align:center}
.cell{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:2px 4px;font-family:var(--f-mono);font-size:12px}
.c0{background:var(--surface2);color:var(--muted)}.c1{background:var(--bad-soft);color:var(--bad)}.c2{background:var(--copper-soft);color:var(--copper)}.c3{background:var(--good-soft);color:var(--good)}
.bars{display:grid;gap:8px;margin:6px 0 18px}
.bar{display:grid;grid-template-columns:200px 1fr 46px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--trace)}
.bar .track i.low{background:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:560px){.hud{grid-template-columns:1fr}.rank{align-items:flex-start}.bar{grid-template-columns:110px 1fr 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hud">
    <div class="left">
      <h1>Lab Transistor</h1>
      <div class="sub">Misi belajar Elektronika · Minggu 6 (BJT) &amp; Minggu 7 (Bias &amp; Penguat)</div>
      <div class="sync" id="sync"><i></i><span id="syncText">Memuat…</span></div>
    </div>
    <div class="rank">
      <span class="lbl">Pangkat</span>
      <span class="name" id="rankName">Pemula</span>
      <div class="xpbar"><i id="xpFill"></i></div>
      <span class="xptext mono" id="xpText">0 XP</span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-map" aria-selected="true">Peta Misi</button>
    <button class="tab" role="tab" id="tab-badges" aria-selected="false">Lencana</button>
    <button class="tab" role="tab" id="tab-me" aria-selected="false">Identitas</button>
  </nav>

  <div id="notice" class="notice" hidden></div>
  <main id="view"></main>
</div>

<script>
(() => {
"use strict";
/* ================== KONFIGURASI DOSEN (ubah di sini) ================== */
// Tempel URL Web app Google Apps Script (diakhiri /exec) di antara tanda kutip:
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw-ngIs-ESi7jrAzAln88pKjXCC8BfYHmfdVEtsTiP-9Ikp63xqS-rO_9bEUNmd1ZN4ng/exec";
// Aturan Ujian Akhir:
const UJIAN = {
  menit: 20,               // batas waktu ujian (menit)
  maksPelanggaran: 3,      // ujian otomatis berakhir setelah sekian kali pindah tab/keluar layar penuh
  wajibLayarPenuh: true,   // ujian dijeda bila keluar dari layar penuh
  wajibSEB: false          // true = Ujian Akhir hanya bisa dimulai dari Safe Exam Browser
};
/* ======================================================================= */
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const f = (x, d = 2) => Number(x).toLocaleString("id-ID", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// "I_B" -> I<sub>B</sub>, "r'_e" etc.
const sx = s => esc(s).replace(/_\{([^}]*)\}/g, "<sub>$1</sub>").replace(/_([A-Za-z0-9()]+)/g, "<sub>$1</sub>");
const par = (...r) => 1 / r.reduce((a, x) => a + 1 / x, 0);
const parseNum = v => { const t = String(v).trim().replace(/\s/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", "."); return t === "" ? NaN : Number(t); };
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on ? "star-on" : "star-off"}" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
const stars = n => `<span class="stars" aria-label="${n} bintang">${STAR(n >= 1)}${STAR(n >= 2)}${STAR(n >= 3)}</span>`;
const ICON = {
  lock: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M7 10V8a5 5 0 0110 0v2h1a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1h1zm2 0h6V8a3 3 0 00-6 0v2z"/></svg>',
  chip: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 2h2v3h4V2h2v3h1a2 2 0 012 2v1h3v2h-3v4h3v2h-3v1a2 2 0 01-2 2h-1v3h-2v-3h-4v3H8v-3H7a2 2 0 01-2-2v-1H2v-2h3v-4H2V8h3V7a2 2 0 012-2h1V2zm-1 5v10h10V7H7z"/></svg>',
};

/* ---------------- question builders ---------------- */
const num = (q, ans, unit, steps, o = {}) => ({ kind: "num", q, ans, unit, steps, tol: o.tol ?? 0.03, ctx: o.ctx, dec: o.dec ?? 2 });
const mcq = (q, opts, ans, why, o = {}) => ({ kind: "mcq", q, opts, ans, why, ctx: o.ctx });
const ctxTable = rows => `<table>${rows.map(r => `<tr><td>${sx(r[0])}</td><td class="mono">${sx(r[1])}</td></tr>`).join("")}</table>`;
// shuffle MCQ options, keep answer
function mix(m) { const idx = shuffle(m.opts.map((_, i) => i)); return { ...m, opts: idx.map(i => m.opts[i]), ans: idx.indexOf(m.ans) }; }
function sample(arr, n) { return shuffle(arr).slice(0, n); }

/* ---------------- LEVELS ---------------- */
const LEVELS = [
{ id: "L1", week: 6, title: "Kenalan dengan BJT", desc: "Struktur, NPN/PNP, simbol",
  lesson: [
    ["Tiga lapisan, dua sambungan", "Emitor (doping paling tinggi), basis (sangat tipis), kolektor (paling besar). Sambungan BE dan BC menentukan cara kerjanya."],
    ["NPN vs PNP", "Panah selalu di emitor. NPN: panah keluar. PNP: panah masuk. Agar NPN aktif, V_B ≈ 0,7 V di atas V_E."],
    ["Analogi keran", "Arus basis kecil adalah tuas keran yang mengatur arus besar dari kolektor ke emitor."]],
  gen() { return sample([
    mcq("Pada transistor NPN, lapisan di tengah (basis) bertipe…", ["P", "N", "Intrinsik", "Logam"], 0, "NPN tersusun N–P–N, jadi basis di tengah bertipe P."),
    mcq("Pada simbol NPN, panah di kaki emitor mengarah…", ["Keluar dari transistor", "Masuk ke transistor", "Ke kolektor", "Tidak ada panah"], 0, "NPN: \"N Never Points iN\". Panah keluar, searah arus konvensional."),
    mcq("Daerah transistor dengan doping paling tinggi adalah…", ["Emitor", "Basis", "Kolektor", "Semua sama"], 0, "Emitor diberi doping paling tinggi karena tugasnya \"menyemprotkan\" pembawa muatan."),
    mcq("Mengapa basis dibuat sangat tipis?", ["Agar sebagian besar elektron lolos ke kolektor", "Agar transistor lebih murah", "Agar tahan tegangan tinggi", "Agar arus basis besar"], 0, "Basis tipis membuat hanya sedikit elektron berekombinasi di basis; hampir semuanya sampai ke kolektor."),
    mcq("BJT dikendalikan oleh…", ["Arus basis", "Tegangan gate", "Medan magnet", "Cahaya"], 0, "BJT = transistor dikendalikan arus. FET-lah yang dikendalikan tegangan gate."),
    mcq("Tegangan V_BE transistor silikon saat menghantar kira-kira…", ["0,7 V", "0,3 V", "1,5 V", "5 V"], 0, "Silikon ≈ 0,7 V, germanium ≈ 0,3 V."),
    mcq("Pasangan PNP yang umum untuk BC547 (NPN) adalah…", ["BC557", "2N3904", "TIP31", "2N3055"], 0, "BC547 (NPN) berpasangan dengan BC557 (PNP)."),
  ], 5).map(mix); } },

{ id: "L2", week: 6, title: "Arus, α, dan β", desc: "KCL, alpha, beta",
  lesson: [
    ["Hukum Kirchhoff arus", "Semua arus yang masuk keluar lewat emitor.", "I_E = I_C + I_B"],
    ["Beta (penguatan arus)", "Berapa kali arus basis diperbesar. Di datasheet disebut h_FE.", "β = I_C / I_B"],
    ["Alpha dan hubungannya", "α selalu sedikit di bawah 1.", "α = I_C/I_E ; β = α/(1−α)"]],
  gen() {
    const IB = pick([10, 15, 20, 25, 40]), IC = pick([1, 1.5, 2, 3, 4]); const IE = IC + IB / 1000;
    const a2 = pick([0.98, 0.99, 0.995]); const b3 = pick([80, 100, 120, 150, 200]), IB3 = pick([10, 20, 30, 50]);
    return [

{ id: "L4", week: 6, title: "Daerah Kerja", desc: "Aktif, saturasi, cut-off",
  lesson: [
    ["Cut-off (saklar OFF)", "I_B = 0 atau V_BB < 0,7 V. I_C ≈ 0 dan V_CE ≈ V_CC."],
    ["Aktif (penguat)", "BE maju, BC mundur. I_C = β·I_B dan V_CE di atas ±0,2 V."],
    ["Saturasi (saklar ON)", "Jika β·I_B lebih besar dari arus maksimum, transistor jenuh.", "I_C(sat) = (V_CC − 0,2) / R_C"]],
  gen() {
    const one = (want) => { let c, reg; let n = 0; do { n++; c = { VBB: want === "cut" ? pick([0, 0.3, 0.5]) : pick([2, 3, 5]), RB: want === "sat" ? pick([4.7, 10, 22]) : pick([100, 150, 220, 330]), RC: pick([1, 2.2]), VCC: pick([10, 12]), b: pick([50, 100, 150]) };
        c.IB = Math.max(0, (c.VBB - 0.7) / c.RB); c.bIB = c.b * c.IB; c.Isat = (c.VCC - 0.2) / c.RC;
        reg = c.VBB < 0.7 ? "cut" : (c.bIB >= c.Isat ? "sat" : "act"); } while (reg !== want && n < 200);
      const names = { act: "Aktif", sat: "Saturasi", cut: "Cut-off" };
      const ctx = ctxTable([["V_BB", `${f(c.VBB)} V`], ["R_B", `${f(c.RB)} kΩ`], ["R_C", `${f(c.RC)} kΩ`], ["V_CC", `${c.VCC} V`], ["β", c.b]]);
      const why = reg === "cut" ? `V_BB = ${f(c.VBB)} V lebih kecil dari 0,7 V, jadi I_B = 0, I_C ≈ 0 → Cut-off.`
        : `I_B = (${c.VBB} − 0,7)/${f(c.RB)} kΩ = ${f(c.IB * 1000)} µA. β·I_B = ${f(c.bIB, 3)} mA. I_C(sat) = (${c.VCC} − 0,2)/${f(c.RC)} kΩ = ${f(c.Isat, 3)} mA. ${reg === "sat" ? `${f(c.bIB, 3)} > ${f(c.Isat, 3)} → Saturasi.` : `${f(c.bIB, 3)} < ${f(c.Isat, 3)} → Aktif.`}`;
      return mcq("Transistor pada rangkaian ini bekerja di daerah…", ["Aktif", "Saturasi", "Cut-off"], ["act", "sat", "cut"].indexOf(reg), why, { ctx }); };
    return [one(pick(["act", "sat"])), one("cut"), one("sat"), one("act"),
      mix(mcq("Agar output penguat tidak terpotong, transistor harus tetap di daerah…", ["Aktif", "Saturasi", "Cut-off", "Breakdown"], 0, "Penguat linier bekerja di daerah aktif. Saturasi dan cut-off memotong sinyal."))];
  } },

/* ---------------- progress model ---------------- */

function totals(p = P) {

  for (const l of LEVELS) { const r = p.levels?.[l.id]; if (!r) continue; xp += Math.round(r.best) + (r.stars === 3 ? 20 : 0); st += r.stars || 0; if (r.best >= PASS) pass++; att += r.attempts || 0; }

}
const RANKS = [[0, "Pemula"], [200, "Perakit"], [500, "Teknisi"], [850, "Analis"], [1150, "Insinyur"]];
const rankOf = xp => { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (xp >= RANKS[i][0]) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { r, next }; };

/* ---------------- exam (Ujian Akhir) ---------------- */
function fmtLeft() { const X = state.exam; if (!X) return ""; const ms = Math.max(0, X.deadline - Date.now()); const m = Math.floor(ms / 60000), sec = Math.floor(ms / 1000) % 60; return `Sisa ${m}:${String(sec).padStart(2, "0")}`; }
function violation(kind) {
  const X = state.exam; if (!X || X.ending) return;
  const now = Date.now(); if (now - X.lastViol < 1500) return; X.lastViol = now;
  X.viol++; X.log.push(kind); saveExam();
  if (X.viol >= UJIAN.maksPelanggaran) { finishQuiz(`Ujian dihentikan otomatis: ${X.viol} kali keluar dari halaman ujian.`); return; }
  render();
}
function saveExam() { const X = state.exam, Q = state.quiz; if (!X) return; P.exam = { start: X.start, deadline: X.deadline, viol: X.viol, correct: Q.answers.filter(a => a && a.ok).length, total: Q.qs.length }; saveLocal(); }
async function enterFS() { try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) { } }
function exitFS() { try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) { } }
document.addEventListener("visibilitychange", () => { if (document.hidden) violation("pindah tab/aplikasi"); });
document.addEventListener("fullscreenchange", () => { if (!state.exam) return; if (!document.fullscreenElement && UJIAN.wajibLayarPenuh && state.exam.fsSupported) violation("keluar layar penuh"); else render(); });
["copy", "cut", "paste", "contextmenu"].forEach(ev => document.addEventListener(ev, e => { if (state.exam) e.preventDefault(); }));
// Ujian yang terputus (halaman ditutup/dimuat ulang) dinilai dari jawaban yang sudah masuk.
function recoverExam() {
  if (!P.exam || P.levels.BOSS) { P.exam = null; return; }
  const E = P.exam, pct = Math.round((E.correct || 0) / (E.total || 8) * 100);
  P.levels.BOSS = { best: pct, stars: starsFor(pct), attempts: 1, last: Date.now() };
  submit(record(LV.BOSS, pct, E.correct || 0, E.total || 8, pct, 1, E.viol || 0, "Halaman ditutup/dimuat ulang saat ujian", Math.round((Date.now() - E.start) / 1000)));
  P.exam = null; persist();

}

  return { nama: P.nama, nim: P.nim, kelas: P.kelas, misi: l.id, judul: l.title, skor: pct, benar: correct, jumlah: total, bintang: starsFor(pct), terbaik: best, percobaan: attempts, pelanggaran: viol, catatan: note || "", durasi_detik: dur, waktu_klien: new Date().toISOString() };
}

}
async function startQuiz() {
  const l = state.level;
  if (!identOK()) { state.level = null; state.tab = "me"; notice("Isi nama, NIM, dan kelas dulu sebelum mengerjakan misi."); render(); return; }
  if (l.id === "BOSS") {
    if (P.levels.BOSS) { render(); return; }
    if (UJIAN.wajibSEB && !/SEB/i.test(navigator.userAgent)) { notice("Ujian Akhir hanya bisa dimulai dari aplikasi Safe Exam Browser. Hubungi dosen untuk file konfigurasinya."); return; }
    const fsSupported = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled);
    if (UJIAN.wajibLayarPenuh && fsSupported) await enterFS();
    const start = Date.now();
    state.exam = { start, deadline: start + UJIAN.menit * 60000, viol: 0, log: [], lastViol: 0, fsSupported };
    state.exam.timer = setInterval(() => { const t = $("#examTimer"); if (t) t.textContent = fmtLeft(); if (Date.now() >= state.exam.deadline) finishQuiz("Waktu ujian habis."); }, 1000);
  }

}
function answer(a) {
  const Q = state.quiz; Q.answers[Q.i] = a;
  if (state.exam) { saveExam(); if (Q.i + 1 < Q.qs.length) { Q.i++; render(); } else finishQuiz(); return; }
  render();
}
function finishQuiz(reason) {
  const Q = state.quiz, l = state.level, X = state.exam;
  if (X) { if (X.ending) return; X.ending = true; clearInterval(X.timer); }
  const correct = Q.answers.filter(a => a && a.ok).length, total = Q.qs.length, pct = Math.round(correct / total * 100);
  const before = earned(); const prev = P.levels[l.id];
  const best = Math.max(prev?.best ?? 0, pct);
  P.levels[l.id] = { best, stars: starsFor(best), attempts: (prev?.attempts || 0) + 1, last: Date.now() };
  const after = earned(); const newB = after.filter(x => !before.includes(x)).map(x => BADGES.find(b => b[0] === x)[1]);
  const i = LEVELS.indexOf(l);
  state.result = { pct, correct, total, stars: starsFor(pct), best: pct > (prev?.best ?? -1), prev: Math.round(prev?.best ?? 0), newBadges: newB, next: pct >= PASS && LEVELS[i + 1] && !(prev?.best >= PASS), reason: X ? reason : "" };
  submit(record(l, pct, correct, total, best, P.levels[l.id].attempts, X ? X.viol : "", X ? [reason, X.log.length ? "pelanggaran: " + X.log.join(", ") : ""].filter(Boolean).join(" · ") : "", Math.round((Date.now() - Q.start) / 1000)));
  if (X) { state.exam = null; P.exam = null; exitFS(); }
  state.inQuiz = false; persist(); render(); window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (state.exam && !t.dataset.opt && !["next", "quit", "fs"].includes(t.dataset.act) && t.id !== "numsubmit") { if (t.type !== "submit") return; }
  if (t.classList.contains("tab")) { state.tab = t.id.replace("tab-", ""); state.level = null; state.result = null; state.inQuiz = false; render(); return; }
  if (t.dataset.lv) { if (!identOK()) { state.tab = "me"; notice("Isi nama, NIM, dan kelas dulu sebelum mengerjakan misi."); render(); return; } state.level = LV[t.dataset.lv]; state.result = null; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.opt != null) { const q = state.quiz.qs[state.quiz.i]; if (state.quiz.answers[state.quiz.i]) return; const k = +t.dataset.opt; answer({ pick: k, ok: k === q.ans }); return; }
  const act = t.dataset.act;
  if (act === "home") { state.level = null; state.result = null; state.inQuiz = false; state.tab = "map"; render(); }
  else if (act === "start" || act === "retry") startQuiz();
  else if (act === "quit") { if (state.exam) finishQuiz("Ujian diakhiri oleh mahasiswa."); else { state.inQuiz = false; render(); } }
  else if (act === "fs") { enterFS(); }
  else if (act === "next") { const Q = state.quiz; if (Q.i + 1 < Q.qs.length) { Q.i++; render(); } else finishQuiz(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "numform") {
    const raw = $("#numans").value, v = parseNum(raw); if (isNaN(v)) { $("#numans").setCustomValidity("Masukkan angka"); $("#numans").reportValidity(); $("#numans").setCustomValidity(""); return; }
    const q = state.quiz.qs[state.quiz.i]; const ok = Math.abs(v - q.ans) <= Math.abs(q.ans) * q.tol + 1e-9;
    answer({ raw, ok });
  } else if (e.target.id === "identform") {
    P.nama = $("#nama").value.trim(); P.nim = $("#nim").value.trim(); P.kelas = $("#kelas").value.trim(); persist(); setSync();
    if (identOK()) { notice(null); $("#identmsg").textContent = "Identitas tersimpan. Silakan mulai dari Peta Misi."; }
  }
});
window.addEventListener("beforeunload", e => { if (state.exam) { saveExam(); e.preventDefault(); e.returnValue = ""; } });

loadLocal(); recoverExam();
if (!identOK()) { state.tab = "me"; notice("Selamat datang! Isi nama, NIM, dan kelas dulu, lalu mulai dari Misi 01."); }
else if (!sheetReady()) notice("Mode latihan: alamat Google Sheet belum diisi dosen, jadi nilai belum dikirim.");
render(); setSync(); flush();
})();
</script>
